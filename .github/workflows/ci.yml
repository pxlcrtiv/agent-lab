name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI demo
        run: python -m agentlab demo
      - name: Smoke-test the lead-triage workflow
        run: python -m agentlab workflow examples/lead_triage.py --state role_type=ai-agent-engineer remote=true visa=true