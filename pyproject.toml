[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab"
version = "0.1.0"
description = "A lean, dependency-free AI agent framework: tool use, memory, and workflow automation in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pxlcrtiv" }]
keywords = ["ai-agent", "function-calling", "llm", "workflow", "memory", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies on purpose -- stdlib only.

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentlab"]